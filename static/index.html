<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Forestal Chiapas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, sans-serif;
            background: #0a1628;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: #1e2d45;
            padding: 16px 20px;
            border-bottom: 1px solid #2d3f5a;
        }

        .header h1 {
            color: #4ade80;
            font-size: 1.2rem;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .layout {
            display: flex;
            height: calc(100vh - 60px);
        }

        .panel-left {
            width: 380px;
            min-width: 320px;
            overflow-y: auto;
            padding: 16px;
            background: #0a1628;
        }

        .panel-right {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .card {
            background: #1e2d45;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        label:first-child {
            margin-top: 0;
        }

        input,
        select {
            width: 100%;
            background: #0a1628;
            border: 1px solid #2d3f5a;
            border-radius: 6px;
            padding: 8px 12px;
            color: #e0e0e0;
            font-size: 0.95rem;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4ade80;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row>div {
            flex: 1;
        }

        button.primary {
            width: 100%;
            background: #4ade80;
            color: #0a1628;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
        }

        button.primary:disabled {
            background: #2d3f5a;
            color: #94a3b8;
            cursor: not-allowed;
        }

        button.secondary {
            width: 100%;
            background: transparent;
            border: 1px dashed #4ade80;
            color: #4ade80;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .tab {
            flex: 1;
            background: #1e2d45;
            border: none;
            border-radius: 6px;
            padding: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.82rem;
        }

        .tab.active {
            background: #4ade80;
            color: #0a1628;
            font-weight: 700;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .resultado {
            display: none;
        }

        .sitio-titulo {
            color: #4ade80;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .indice-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .indice-card {
            background: #0a1628;
            border-radius: 8px;
            padding: 12px;
        }

        .indice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .indice-nombre {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .indice-valor {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
        }

        .indice-comparativa {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.78rem;
        }

        .año-label {
            color: #94a3b8;
        }

        .año-valor {
            color: #e0e0e0;
            font-weight: 600;
        }

        .tendencia {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-top: 6px;
        }

        .positivo {
            color: #4ade80;
        }

        .negativo {
            color: #f87171;
        }

        .neutro {
            color: #fbbf24;
        }

        .barra-cambio {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            background: #2d3f5a;
        }

        .barra-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s;
        }

        .interpretacion {
            background: #0a1628;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 16px;
            display: none;
            font-size: 0.88rem;
        }

        .error {
            background: #2d1b1b;
            border: 1px solid #f87171;
            border-radius: 8px;
            padding: 12px;
            color: #f87171;
            display: none;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .vertice-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .vertice-row input {
            margin: 0;
        }

        .años-selector {
            display: flex;
            gap: 8px;
        }

        .años-selector>div {
            flex: 1;
        }

        @media (max-width: 700px) {
            .layout {
                flex-direction: column;
                height: auto;
            }

            .panel-left {
                width: 100%;
            }

            .panel-right {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🛰️ Monitoreo Forestal Chiapas</h1>
        <p>Análisis de salud vegetal con imágenes satelitales Sentinel-2</p>
    </div>

    <div class="layout">
        <div class="panel-left">

            <div class="tabs">
                <button class="tab active" onclick="switchTab('punto', event)">📍 Punto</button>
                <button class="tab" onclick="switchTab('poligono', event)">🔷 Polígono</button>
            </div>

            <!-- Panel Punto -->
            <div class="panel active" id="panel-punto">
                <div class="card">
                    <label>Nombre del sitio</label>
                    <input type="text" id="nombre" value="Mi sitio">
                    <label>Latitud</label>
                    <input type="number" id="lat" placeholder="Ej: 16.8" step="any">
                    <label>Longitud</label>
                    <input type="number" id="lon" placeholder="Ej: -91.5" step="any">
                    <div class="años-selector" style="margin-top:10px;">
                        <div>
                            <label>Año base</label>
                            <select id="anio_base">
                                <option value="2017">2017</option>
                                <option value="2018">2018</option>
                                <option value="2019">2019</option>
                                <option value="2020">2020</option>
                                <option value="2021">2021</option>
                                <option value="2022">2022</option>
                                <option value="2023">2023</option>
                                <option value="2024" selected>2024</option>
                            </select>
                        </div>
                        <div>
                            <label>Año actual</label>
                            <select id="anio_actual">
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026" selected>2026</option>
                            </select>
                        </div>
                    </div>
                    <button class="primary" id="btn-punto" onclick="analizarPunto()">🔍 Analizar</button>
                </div>
            </div>

            <!-- Panel Polígono -->
            <div class="panel" id="panel-poligono">
                <div class="card">
                    <label>Nombre del sitio</label>
                    <input type="text" id="nombre-pol" value="Mi polígono">
                    <label>Vértices (Longitud, Latitud)</label>
                    <div id="vertices"></div>
                    <button class="secondary" onclick="agregarVertice()">+ Agregar vértice</button>
                    <div class="años-selector" style="margin-top:10px;">
                        <div>
                            <label>Año base</label>
                            <select id="anio_base_pol">
                                <option value="2017">2017</option>
                                <option value="2018">2018</option>
                                <option value="2019">2019</option>
                                <option value="2020">2020</option>
                                <option value="2021">2021</option>
                                <option value="2022">2022</option>
                                <option value="2023">2023</option>
                                <option value="2024" selected>2024</option>
                            </select>
                        </div>
                        <div>
                            <label>Año actual</label>
                            <select id="anio_actual_pol">
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026" selected>2026</option>
                            </select>
                        </div>
                    </div>
                    <button class="primary" id="btn-poligono" onclick="analizarPoligono()">🔍 Analizar</button>
                </div>
            </div>

            <div class="loading" id="loading">⏳ Consultando imágenes satelitales...<br><small>Esto tarda 30-60
                    segundos</small></div>
            <div class="error" id="error"></div>

            <!-- Resultado -->
            <div class="resultado card" id="resultado">
                <div class="sitio-titulo" id="sitio-nombre"></div>
                <div class="indice-grid" id="indices"></div>
                <div class="interpretacion" id="interpretacion"></div>
            </div>

        </div>

        <div class="panel-right">
            <div id="map"></div>
        </div>
    </div>

    <script>
        const API = 'https://monitoreo-chiapas-306961522035.us-central1.run.app';

        // Inicializar mapa
        const map = L.map('map').setView([16.5, -92.0], 8);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Esri World Imagery'
        }).addTo(map);

        let capaActual = null;

        function switchTab(tab, event) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
        }

        function agregarVertice() {
            const div = document.getElementById('vertices');
            const idx = div.children.length + 1;
            const row = document.createElement('div');
            row.className = 'vertice-row';
            row.innerHTML = `
        <input type="number" placeholder="Lon ${idx}" step="any">
        <input type="number" placeholder="Lat ${idx}" step="any">
    `;
            div.appendChild(row);
        }

        function mostrarEnMapa(lat, lon, radio) {
            if (capaActual) map.removeLayer(capaActual);
            capaActual = L.circle([lat, lon], {
                color: '#4ade80',
                fillColor: '#4ade80',
                fillOpacity: 0.15,
                radius: radio || 1000,
                weight: 2
            }).addTo(map);
            map.setView([lat, lon], 13);
        }

        function mostrarPoligonoEnMapa(vertices) {
            if (capaActual) map.removeLayer(capaActual);
            const latlngs = vertices.map(v => [v[1], v[0]]);
            capaActual = L.polygon(latlngs, {
                color: '#4ade80',
                fillColor: '#4ade80',
                fillOpacity: 0.15,
                weight: 2
            }).addTo(map);
            map.fitBounds(capaActual.getBounds(), { padding: [40, 40] });
        }

        function interpretacion(indices, anioBase, anioActual) {
            const ndviDelta = indices.ndvi.delta;
            const nbrDelta = indices.nbr.delta;
            let texto = '';

            if (ndviDelta > 0.1) texto += `🌿 La vegetación mejoró significativamente entre ${anioBase} y ${anioActual}. `;
            else if (ndviDelta > 0.02) texto += `🌱 La vegetación muestra una mejora moderada entre ${anioBase} y ${anioActual}. `;
            else if (ndviDelta > -0.02) texto += `➡️ La vegetación se mantiene estable entre ${anioBase} y ${anioActual}. `;
            else if (ndviDelta > -0.1) texto += `⚠️ Se detecta degradación leve de la vegetación entre ${anioBase} y ${anioActual}. `;
            else texto += `🚨 Se detecta degradación severa de la vegetación entre ${anioBase} y ${anioActual}. `;

            if (nbrDelta < -0.15) texto += '🔥 Posible actividad de incendio reciente detectada.';
            else if (nbrDelta > 0.05) texto += '✅ Sin evidencia de incendios recientes.';
            else texto += '🔍 Condición post-incendio estable.';

            return texto;
        }

        function mostrarResultado(data) {
            const anioBase = data.anio_base;
            const anioActual = data.anio_actual;
            document.getElementById('sitio-nombre').textContent = '📍 ' + data.sitio + ` (${anioBase} → ${anioActual})`;

            const nombres = {
                ndvi: 'NDVI — Salud vegetal general',
                evi: 'EVI — Densidad de vegetación',
                nbr: 'NBR — Estado post-incendio',
                ndwi: 'NDWI — Contenido de agua en vegetación',
                bsi: 'BSI — Suelo desnudo / Deforestación'
            };

            const explicaciones = {
                ndvi: { pos: 'Más vegetación', neg: 'Menos vegetación', neu: 'Sin cambio' },
                evi: { pos: 'Mayor densidad forestal', neg: 'Menor densidad forestal', neu: 'Sin cambio' },
                nbr: { pos: 'Bosque más sano', neg: 'Posible quema o perturbación', neu: 'Sin cambio' },
                ndwi: { pos: 'Más agua en vegetación — indica bosque maduro', neg: 'Menos agua — posible conversión a pasto', neu: 'Sin cambio' },
                bsi: { pos: 'Más suelo expuesto — alerta de deforestación', neg: 'Menos suelo expuesto — recuperación', neu: 'Sin cambio' }
            };

            // Clasificación
            const clasBase = data.clasificacion[String(anioBase)];
            const clasActual = data.clasificacion[String(anioActual)];
            let htmlClas = `
        <div style="margin-bottom:12px; background:#0a1628; border-radius:8px; padding:12px;">
            <div style="font-size:0.78rem; color:#94a3b8; margin-bottom:6px;">🌿 Tipo de cobertura vegetal</div>
            <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                <span><span style="color:#94a3b8">${anioBase}: </span><strong>${clasBase}</strong></span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-top:4px;">
                <span><span style="color:#94a3b8">${anioActual}: </span><strong style="color:#4ade80">${clasActual}</strong></span>
            </div>
            ${clasBase !== clasActual ? `<div style="margin-top:8px; font-size:0.82rem; color:#fbbf24;">⚠️ El tipo de cobertura cambió entre ${anioBase} y ${anioActual}</div>` : ''}
        </div>`;

            let html = htmlClas;

            for (const [key, val] of Object.entries(data.indices)) {
                const delta = val.delta;
                // Para BSI el delta positivo es malo (más suelo desnudo)
                const esBSI = key === 'bsi';
                const deltaClass = Math.abs(delta) < 0.02 ? 'neutro' : (esBSI ? (delta > 0 ? 'negativo' : 'positivo') : (delta > 0 ? 'positivo' : 'negativo'));
                const deltaIcon = Math.abs(delta) < 0.02 ? '→' : delta > 0 ? '▲' : '▼';
                const deltaTexto = delta > 0 ? `+${delta.toFixed(3)}` : delta.toFixed(3);
                const exp = explicaciones[key];
                const expTexto = Math.abs(delta) < 0.02 ? exp.neu : (esBSI ? (delta > 0 ? exp.pos : exp.neg) : (delta > 0 ? exp.pos : exp.neg));
                const pct = Math.min(Math.abs(delta) / 0.3 * 100, 100);
                const barColor = deltaClass === 'positivo' ? '#4ade80' : deltaClass === 'negativo' ? '#f87171' : '#fbbf24';

                html += `
        <div class="indice-card">
            <div class="indice-nombre">${nombres[key]}</div>
            <div class="indice-valor">${val[String(anioActual)].toFixed(3)}</div>
            <div class="indice-comparativa">
                <span><span class="año-label">${anioBase}: </span><span class="año-valor">${val[String(anioBase)].toFixed(3)}</span></span>
                <span><span class="año-label">${anioActual}: </span><span class="año-valor">${val[String(anioActual)].toFixed(3)}</span></span>
            </div>
            <div class="tendencia ${deltaClass}">${deltaIcon} ${deltaTexto} — ${expTexto}</div>
            <div class="barra-cambio"><div class="barra-fill" style="width:${pct}%; background:${barColor}"></div></div>
        </div>`;
            }

            document.getElementById('indices').innerHTML = html;
            document.getElementById('interpretacion').textContent = interpretacion(data.indices, anioBase, anioActual);
            document.getElementById('resultado').style.display = 'block';
        }

        async function analizarPunto() {
            const nombre = document.getElementById('nombre').value;
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            const anio_base = parseInt(document.getElementById('anio_base').value);
            const anio_actual = parseInt(document.getElementById('anio_actual').value);

            if (!lat || !lon) { mostrarError('Ingresa latitud y longitud'); return; }
            if (anio_base >= anio_actual) { mostrarError('El año base debe ser menor al año actual'); return; }

            mostrarEnMapa(lat, lon, 1000);
            iniciarCarga('btn-punto');

            try {
                const res = await fetch(API + '/analizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat, lon, nombre, anio_base, anio_actual })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                mostrarResultado(data);
            } catch (e) {
                mostrarError('Error: ' + e.message);
            } finally {
                terminarCarga('btn-punto', '🔍 Analizar');
            }
        }

        async function analizarPoligono() {
            const nombre = document.getElementById('nombre-pol').value;
            const anio_base = parseInt(document.getElementById('anio_base_pol').value);
            const anio_actual = parseInt(document.getElementById('anio_actual_pol').value);
            const rows = document.querySelectorAll('#vertices .vertice-row');
            const vertices = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                const lon = parseFloat(inputs[0].value);
                const lat = parseFloat(inputs[1].value);
                if (!isNaN(lon) && !isNaN(lat)) vertices.push([lon, lat]);
            });

            if (vertices.length < 3) { mostrarError('Ingresa al menos 3 vértices'); return; }
            if (anio_base >= anio_actual) { mostrarError('El año base debe ser menor al año actual'); return; }

            mostrarPoligonoEnMapa(vertices);
            iniciarCarga('btn-poligono');

            try {
                const res = await fetch(API + '/analizar/poligono', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vertices, nombre, anio_base, anio_actual })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                mostrarResultado(data);
            } catch (e) {
                mostrarError('Error: ' + e.message);
            } finally {
                terminarCarga('btn-poligono', '🔍 Analizar');
            }
        }

        function iniciarCarga(btnId) {
            document.getElementById(btnId).disabled = true;
            document.getElementById(btnId).textContent = '⏳ Analizando...';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('resultado').style.display = 'none';
        }

        function terminarCarga(btnId, texto) {
            document.getElementById(btnId).disabled = false;
            document.getElementById(btnId).textContent = texto;
            document.getElementById('loading').style.display = 'none';
        }

        function mostrarError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        for (let i = 0; i < 4; i++) agregarVertice();
    </script>
</body>

</html>
